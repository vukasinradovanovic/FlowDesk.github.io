@if (_totalCount() > 0) {
  <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-3 border-top gap-2">
    <!-- Info Display -->
    <div class="text-secondary small">
      Showing <b>{{ startItem() }}</b> to <b>{{ endItem() }}</b> of <b>{{ _totalCount() }}</b> entries
    </div>

    <!-- Navigation -->
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <!-- Previous -->
        <li class="page-item" [class.disabled]="_currentPage() === 1">
          <button class="page-link" type="button" (click)="selectPage(_currentPage() - 1)">
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>

        <!-- Page Numbers -->
        @for (page of pageNumbers(); track $index) {
          <li class="page-item" [class.active]="page === _currentPage()" [class.disabled]="page === '...'">
            <button class="page-link" type="button" (click)="selectPage(page)">
              {{ page }}
            </button>
          </li>
        }

        <!-- Next -->
        <li class="page-item" [class.disabled]="_currentPage() === _totalPages()">
          <button class="page-link" type="button" (click)="selectPage(_currentPage() + 1)">
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
}
