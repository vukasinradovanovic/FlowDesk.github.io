<div class="search-control">
	<i class="bi bi-search" aria-hidden="true"></i>
	<label class="visually-hidden" [for]="'search-' + label()">{{ label() }}</label>
	<input
		class="form-control form-control-sm"
		[type]="'search'"
		[id]="'search-' + label()"
		[placeholder]="placeholder()"
		[value]="value()"
		[attr.aria-label]="label()"
		(input)="onInput($event)"
	/>
</div>
